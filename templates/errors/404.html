{% extends "base.html" %}
{% block title %}Page Not Found - 404{% endblock %}
{% block topbar_title %}Error 404{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-muted mb-3"><i class="bi bi-exclamation-diamond text-warning"></i> 404</div>
    <h2 class="h4 mb-3">Page Not Found</h2>
    <p class="text-secondary mb-4">The page or record you requested does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
