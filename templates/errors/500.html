{% extends "base.html" %}
{% block title %}Internal Server Error - 500{% endblock %}
{% block topbar_title %}Error 500{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-muted mb-3"><i class="bi bi-bug text-danger"></i> 500</div>
    <h2 class="h4 mb-3">Internal Server Error</h2>
    <p class="text-secondary mb-4">A database or application error occurred while processing your request.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
        <i class="bi bi-arrow-clockwise me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
